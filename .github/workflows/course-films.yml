name: Course films

# The 19 course films are large binaries, so they are not stored in git history.
# They live in the repository's Actions cache (keyed by content) and are
# published to a GitHub Release, whose asset URLs are what the download page
# links to.
#
#   Actions → Course films → Run workflow   (or push a course-films-* tag)
# Assets are idempotent (--clobber), so re-running refreshes the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload the films into"
        type: string
        default: course-films-v1
  push:
    tags: ["course-films-*"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Expand the media cache
        uses: actions/cache/restore@v4
        with:
          path: media
          key: ${{ vars.FILMS_CACHE_KEY || 'course-films-media-v2' }}
          fail-on-cache-miss: true

      - name: Inspect the cache
        run: |
          echo "## Films found in cache" >> "$GITHUB_STEP_SUMMARY"
          ls -lh media/films | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"
          count=$(ls media/films/*.mp4 2>/dev/null | wc -l)
          echo "film count: $count"
          test "$count" -ge 1 || { echo "::error::no films in cache"; exit 1; }

      - name: Ensure the release exists
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "CHRISCO Digital Academy — Course Films" \
              --notes "Nineteen vertical course films. See RELEASE-LINKS.md in the repository."

      - name: Upload films
        run: |
          shopt -s nullglob
          for f in media/films/*.mp4; do
            echo "::group::$f"
            gh release upload "$TAG" "$f" --clobber
            echo "::endgroup::"
          done
          shopt -u nullglob

      - name: Upload the full-collection archive
        run: |
          shopt -s nullglob
          zips=(media/bundle/*.zip)
          shopt -u nullglob
          if [ ${#zips[@]} -gt 0 ]; then
            gh release upload "$TAG" "${zips[@]}" --clobber
          fi

      - name: Publish the download page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag = __import__("os").environ["TAG"]
          repo = __import__("os").environ["GITHUB_REPOSITORY"]
          films = sorted(Path("media/films").glob("*.mp4"))
          rows = "\n".join(
              f"| {i:02d} | {f.stem.replace('-', ' ').title()} | "
              f"[MP4](https://github.com/{repo}/releases/download/{tag}/{f.name}) |"
              for i, f in enumerate(films, 1)
          )
          Path("DOWNLOADS.md").write_text(
              "# ⬇️ Course films\n\n"
              f"{len(films)} films · 1080 × 1920 · ~90 s each · narrated and captioned\n\n"
              "| # | Film | Direct download |\n|---|---|---|\n" + rows + "\n"
          )
          print(Path("DOWNLOADS.md").read_text())
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DOWNLOADS.md
          git diff --staged --quiet || git commit -m "Update course film download links"
          git push

      - name: Summary
        run: |
          echo "### ✅ Course films published" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
