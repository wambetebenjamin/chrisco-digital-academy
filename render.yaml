# Render blueprint for CHRISCO Digital Academy.
#
# The frontend is a Next.js app. There is no database service in this file
# because there is no database server: the Google Sheet behind the Apps Script
# Web App is the source of truth. See docs/GOOGLE-SHEETS-BACKEND.md.
#
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repository.
services:
  - type: web
    name: chrisco-digital-academy
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # The one variable that connects the site to the Sheet.
      # Paste the /exec URL from the Apps Script deployment.
      - key: NEXT_PUBLIC_GOOGLE_SCRIPT_WEBAPP_URL
        sync: false

      # Public origin used for canonical URLs, the sitemap and share links.
      # Render injects RENDER_EXTERNAL_URL automatically; set this if you use a
      # custom domain.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      - key: NODE_VERSION
        value: "22"

      # Optional: only needed if the AI chat route is kept.
      - key: ANTHROPIC_API_KEY
        sync: false
